<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 3D - Relevo e Colisões</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 12px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="info">
    <h2>Mundo Minecraft 3D</h2>
    <p><b>WASD:</b> Mover</p>
    <p><b>Mouse:</b> Girar câmera</p>
</div>

<script>
// --- CONFIGURAÇÃO DA CENA ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// --- ILUMINAÇÃO ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(50, 80, 50);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
scene.add(dirLight);

// --- MATERIAIS ---
const materials = {
    grass: new THREE.MeshLambertMaterial({ color: 0x567d46 }),
    wood: new THREE.MeshLambertMaterial({ color: 0x674a27 }),
    leaves: new THREE.MeshLambertMaterial({ color: 0x385e2b }),
    plank: new THREE.MeshLambertMaterial({ color: 0xa07844 }),
    roof: new THREE.MeshLambertMaterial({ color: 0x800000 }),
    skin: new THREE.MeshLambertMaterial({ color: 0xf1c27d }),
    clothes: new THREE.MeshLambertMaterial({ color: 0x00aaaa }),
    pants: new THREE.MeshLambertMaterial({ color: 0x0000aa }),
    botClothes: new THREE.MeshLambertMaterial({ color: 0xaa0000 })
};

const boxGeo = new THREE.BoxGeometry(1, 1, 1);

// Lista para armazenar objetos com colisão (Casas e Árvores)
const colliders = [];

// --- FUNÇÃO DE GERAR RELEVO DO TERRENO ---
function getTerrainHeight(x, z) {
    // Cria elevações suaves usando combinações de ondas seno/cosseno
    const height = Math.sin(x * 0.08) * Math.cos(z * 0.08) * 3 +
                   Math.sin(x * 0.03 + z * 0.03) * 2;
    return Math.floor(height);
}

// --- MUNDO COM RELEVO (120x120) ---
const groundSize = 120;
for (let x = -groundSize / 2; x < groundSize / 2; x++) {
    for (let z = -groundSize / 2; z < groundSize / 2; z++) {
        const y = getTerrainHeight(x, z);
        
        // Bloco de topo (grama)
        const block = new THREE.Mesh(boxGeo, materials.grass);
        block.position.set(x, y, z);
        block.receiveShadow = true;
        scene.add(block);
    }
}

// --- CRIAR ÁRVORE ---
function createTree(x, z) {
    const groundY = getTerrainHeight(Math.round(x), Math.round(z));
    const treeGroup = new THREE.Group();
    
    for (let y = 0; y < 4; y++) {
        const trunk = new THREE.Mesh(boxGeo, materials.wood);
        trunk.position.set(0, y + 0.5, 0);
        trunk.castShadow = true;
        treeGroup.add(trunk);
    }

    for (let lx = -1; lx <= 1; lx++) {
        for (let lz = -1; lz <= 1; lz++) {
            for (let ly = 3; ly <= 5; ly++) {
                if (ly === 5 && (Math.abs(lx) === 1 && Math.abs(lz) === 1)) continue;
                const leaf = new THREE.Mesh(boxGeo, materials.leaves);
                leaf.position.set(lx, ly + 0.5, lz);
                leaf.castShadow = true;
                treeGroup.add(leaf);
            }
        }
    }

    treeGroup.position.set(x, groundY + 0.5, z);
    scene.add(treeGroup);

    // Registra caixa de colisão do tronco
    colliders.push({ x: x, z: z, radius: 0.8 });
}

// --- CRIAR CASA ---
function createHouse(x, z) {
    const groundY = getTerrainHeight(Math.round(x), Math.round(z));
    const houseGroup = new THREE.Group();

    for (let hx = -2; hx <= 2; hx++) {
        for (let hz = -2; hz <= 2; hz++) {
            for (let hy = 0; hy < 3; hy++) {
                if (hx > -2 && hx < 2 && hz > -2 && hz < 2) continue;
                if (hx === 0 && hz === 2 && hy < 2) continue;
                const wall = new THREE.Mesh(boxGeo, materials.plank);
                wall.position.set(hx, hy + 0.5, hz);
                wall.castShadow = true;
                houseGroup.add(wall);
            }
        }
    }

    for (let rx = -2; rx <= 2; rx++) {
        for (let rz = -2; rz <= 2; rz++) {
            const roof = new THREE.Mesh(boxGeo, materials.roof);
            roof.position.set(rx, 3.5, rz);
            roof.castShadow = true;
            houseGroup.add(roof);
        }
    }

    houseGroup.position.set(x, groundY + 0.5, z);
    scene.add(houseGroup);

    // Registra caixa de colisão da casa
    colliders.push({ x: x, z: z, radius: 2.8 });
}

// Gerar Árvores e Casas
for (let i = 0; i < 60; i++) {
    const x = Math.floor(Math.random() * 100) - 50;
    const z = Math.floor(Math.random() * 100) - 50;
    if (Math.abs(x) > 6 || Math.abs(z) > 6) createTree(x, z);
}

for (let i = 0; i < 8; i++) {
    const x = Math.floor(Math.random() * 90) - 45;
    const z = Math.floor(Math.random() * 90) - 45;
    if (Math.abs(x) > 10 || Math.abs(z) > 10) createHouse(x, z);
}

// --- PERSONAGEM & BOTS ---
function createCharacter(isBot = false) {
    const group = new THREE.Group();

    const head = new THREE.Mesh(boxGeo, materials.skin);
    head.position.y = 1.4;
    head.scale.set(0.6, 0.6, 0.6);
    head.castShadow = true;
    group.add(head);

    const body = new THREE.Mesh(boxGeo, isBot ? materials.botClothes : materials.clothes);
    body.position.y = 0.8;
    body.scale.set(0.6, 0.6, 0.3);
    body.castShadow = true;
    group.add(body);

    const legs = new THREE.Mesh(boxGeo, materials.pants);
    legs.position.y = 0.3;
    legs.scale.set(0.5, 0.6, 0.3);
    legs.castShadow = true;
    group.add(legs);

    return group;
}

const player = createCharacter(false);
const startY = getTerrainHeight(0, 0);
player.position.set(0, startY + 0.8, 0);
scene.add(player);

const bots = [];
for (let i = 0; i < 10; i++) {
    const bx = Math.floor(Math.random() * 80) - 40;
    const bz = Math.floor(Math.random() * 80) - 40;
    const by = getTerrainHeight(bx, bz);

    const bot = createCharacter(true);
    bot.position.set(bx, by + 0.8, bz);
    scene.add(bot);

    bots.push({
        mesh: bot,
        targetAngle: Math.random() * Math.PI * 2,
        changeTimer: 0
    });
}

// --- SISTEMA DE COLISÃO ---
function checkCollision(newX, newZ, playerRadius = 0.4) {
    for (let col of colliders) {
        const dx = newX - col.x;
        const dz = newZ - col.z;
        const distance = Math.sqrt(dx * dx + dz * dz);

        if (distance < (col.radius + playerRadius)) {
            return true; // Colidiu
        }
    }
    return false;
}

// --- CONTROLES ---
const keys = { w: false, a: false, s: false, d: false };

window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (keys.hasOwnProperty(key)) keys[key] = true;
});

window.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    if (keys.hasOwnProperty(key)) keys[key] = false;
});

let isMouseDown = false;
let mouseX = 0;
let cameraAngleY = 0;

window.addEventListener('mousedown', (e) => {
    isMouseDown = true;
    mouseX = e.clientX;
});

window.addEventListener('mouseup', () => isMouseDown = false);

window.addEventListener('mousemove', (e) => {
    if (isMouseDown) {
        const deltaX = e.clientX - mouseX;
        cameraAngleY -= deltaX * 0.005;
        mouseX = e.clientX;
    }
});

// --- LOOP PRINCIPAL ---
const playerSpeed = 0.15;
const botSpeed = 0.05;

function animate() {
    requestAnimationFrame(animate);

    // --- Movimento do Jogador ---
    let moveX = 0;
    let moveZ = 0;

    if (keys.w) moveZ -= 1;
    if (keys.s) moveZ += 1;
    if (keys.a) moveX -= 1;
    if (keys.d) moveX += 1;

    if (moveX !== 0 || moveZ !== 0) {
        const angle = Math.atan2(moveX, moveZ) + cameraAngleY;
        const nextX = player.position.x + Math.sin(angle) * playerSpeed;
        const nextZ = player.position.z + Math.cos(angle) * playerSpeed;

        // Só anda se não colidir com árvores/casas
        if (!checkCollision(nextX, nextZ)) {
            player.position.x = nextX;
            player.position.z = nextZ;
        }

        player.rotation.y = angle;

        // Ajusta altura do jogador conforme o relevo do terreno
        const targetY = getTerrainHeight(Math.round(player.position.x), Math.round(player.position.z)) + 0.8;
        player.position.y = targetY + Math.abs(Math.sin(Date.now() * 0.01)) * 0.1;
    } else {
        const targetY = getTerrainHeight(Math.round(player.position.x), Math.round(player.position.z)) + 0.8;
        player.position.y = targetY;
    }

    // --- Atualização da Câmera ---
    const cameraDistance = 12;
    const cameraHeight = 7;
    camera.position.x = player.position.x + Math.sin(cameraAngleY) * cameraDistance;
    camera.position.z = player.position.z + Math.cos(cameraAngleY) * cameraDistance;
    camera.position.y = player.position.y + cameraHeight;
    camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

    // --- Movimento dos Bots com Colisão e Relevo ---
    bots.forEach(bot => {
        bot.changeTimer--;
        if (bot.changeTimer <= 0) {
            bot.targetAngle = Math.random() * Math.PI * 2;
            bot.changeTimer = Math.floor(Math.random() * 200) + 50;
        }

        const nextX = bot.mesh.position.x + Math.sin(bot.targetAngle) * botSpeed;
        const nextZ = bot.mesh.position.z + Math.cos(bot.targetAngle) * botSpeed;

        if (!checkCollision(nextX, nextZ)) {
            bot.mesh.position.x = nextX;
            bot.mesh.position.z = nextZ;
        } else {
            bot.targetAngle += Math.PI; // Inverte direção ao bater em um obstáculo
        }

        bot.mesh.rotation.y = bot.targetAngle;

        // Ajusta altura no terreno
        const botY = getTerrainHeight(Math.round(bot.mesh.position.x), Math.round(bot.mesh.position.z)) + 0.8;
        bot.mesh.position.y = botY + Math.abs(Math.sin(Date.now() * 0.01)) * 0.05;

        // Limite do mapa para os bots
        if (Math.abs(bot.mesh.position.x) > 55 || Math.abs(bot.mesh.position.z) > 55) {
            bot.targetAngle += Math.PI;
        }
    });

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>

</body>
</html>
